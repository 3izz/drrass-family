<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("drrass:theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>شجرة العائلة | الدّراس</title>
<meta name="description" content="شجرة نسب تفاعلية لعائلة الدّراس، ابحث، كبّر وصغّر، واكتشف صلة القرابة بين أي فردين.">

<meta property="og:type" content="website">
<meta property="og:title" content="شجرة العائلة | الدّراس">
<meta property="og:description" content="شجرة نسب تفاعلية لعائلة الدّراس، ابحث، كبّر وصغّر، واكتشف صلة القرابة بين أي فردين.">
<meta property="og:locale" content="ar_AR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/rtl.css">
<link rel="stylesheet" href="assets/css/theme-light.css">
<link rel="stylesheet" href="assets/css/tree.css">
</head>
<body class="is-tree">

<a href="#tree-stage" class="skip-link">تخطَّ إلى الشجرة</a>

<!-- ============ SLIM TREE APP BAR ============ -->
<header class="tree-topbar" id="tree-topbar">
  <div class="tree-topbar__row">
    <a href="index.html" class="tree-topbar__brand" aria-label="العودة إلى الرئيسية">
      <span class="brand__mark">د</span>
      <span class="tree-topbar__title" data-i18n="tree.brand">شجرة الدّراس</span>
    </a>

    <div class="tree-topbar__search search-box" id="tree-search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="tree-search" placeholder="ابحث عن فرد بالاسم…" data-i18n-attr="placeholder:tree.search.placeholder" role="combobox" aria-expanded="false" aria-controls="tree-search-results" aria-autocomplete="list" autocomplete="off">
      <button type="button" class="tree-search__clear" id="tree-search-clear" aria-label="مسح البحث" hidden>✕</button>
      <div class="search-results" id="tree-search-results" role="listbox"></div>
    </div>

    <div class="tree-topbar__actions">
      <button class="tree-icon-btn tree-topbar__search-toggle" id="tree-search-toggle" aria-label="بحث" aria-expanded="false">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="theme-toggle" id="theme-toggle" aria-label="تبديل المظهر" aria-pressed="false" title="فاتح / داكن">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="tree-icon-btn" id="tree-tools-toggle" aria-label="أدوات الشجرة" aria-expanded="false" aria-controls="tree-tools-sheet">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>

  <!-- breadcrumb / "you are here" -->
  <div class="tree-trail" id="tree-trail" aria-live="polite">
    <span class="tree-trail__hint" id="tree-trail-hint" data-i18n="tree.viewingHint">اضغط على أي فرد لعرض تفاصيله</span>
    <nav class="tree-trail__crumbs" id="tree-trail-crumbs" aria-label="مسار الفرد المحدد" hidden></nav>
  </div>
</header>

<main id="main" class="tree-page">
  <div class="tree-stage" id="tree-stage" tabindex="-1">
    <div class="tree-stage__viewport" id="tree-viewport">
      <svg class="tree-links" id="tree-links" aria-hidden="true"></svg>
      <div class="tree-canvas" id="tree-canvas" role="tree" aria-label="شجرة العائلة"></div>
    </div>

    <!-- focus-mode banner -->
    <div class="tree-focus-banner" id="tree-focus-banner" hidden>
      <span id="tree-focus-label">التركيز على فرد</span>
      <button type="button" id="tree-focus-exit" data-i18n="tree.focus.full">عرض كامل الشجرة ✕</button>
    </div>

    <!-- loading / empty -->
    <div class="tree-empty-state" id="tree-loading">
      <div class="loader__emblem" style="width:48px;height:48px;"><span style="font-size:0.95rem;">د</span></div>
      <p data-i18n="common.loading">جارٍ التحميل…</p>
    </div>

    <!-- floating controls -->
    <div class="tree-fabs" role="group" aria-label="التحكم في العرض">
      <button id="zoom-in" class="tree-fab" aria-label="تكبير">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="zoom-out" class="tree-fab" aria-label="تصغير">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoom-fit" class="tree-fab" aria-label="ملء الشاشة بالشجرة">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="zoom-recenter" class="tree-fab" aria-label="توسيط الفرد المحدد" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22"/></svg>
      </button>
    </div>

    <div class="tree-minimap" id="tree-minimap" aria-hidden="true"><canvas id="minimap-canvas" width="200" height="132"></canvas></div>
  </div>

  <!-- kinship calculator -->
  <div class="relation-viewer" id="relation-viewer" aria-hidden="true">
    <div class="relation-viewer__inner">
      <div class="relation-viewer__slots">
        <button class="relation-viewer__slot" id="slot-a" type="button" data-i18n="tree.slot.first">اختر الفرد الأول</button>
        <span class="relation-viewer__x">↔</span>
        <button class="relation-viewer__slot" id="slot-b" type="button" data-i18n="tree.slot.second">اختر الفرد الثاني</button>
      </div>
      <div class="relation-viewer__out">
        <div class="relation-viewer__result" id="relation-result"></div>
        <div class="relation-viewer__path" id="relation-path"></div>
      </div>
      <button class="icon-btn relation-viewer__close" id="relation-close" aria-label="إغلاق حاسبة القرابة">✕</button>
    </div>
  </div>
</main>

<!-- ============ PERSON DETAILS (bottom sheet on mobile, side panel on desktop) ============ -->
<div class="person-sheet" id="person-sheet" role="dialog" aria-modal="false" aria-labelledby="person-sheet-name" hidden>
  <div class="person-sheet__scrim" data-sheet-close></div>
  <div class="person-sheet__panel">
    <button class="person-sheet__handle" data-sheet-close aria-label="إغلاق التفاصيل"></button>
    <div class="person-sheet__body" id="person-sheet-body"></div>
  </div>
</div>

<!-- ============ TOOLS SHEET ============ -->
<div class="tools-sheet" id="tree-tools-sheet" role="dialog" aria-modal="true" aria-label="أدوات الشجرة" hidden>
  <div class="tools-sheet__scrim" data-tools-close></div>
  <div class="tools-sheet__panel">
    <div class="tools-sheet__head">
      <h2 data-i18n="tree.tools.title">أدوات الشجرة</h2>
      <button class="icon-btn" data-tools-close aria-label="إغلاق">✕</button>
    </div>
    <div class="tools-sheet__group">
      <label for="branch-filter" data-i18n="tree.tools.branch">عرض فرع معيّن</label>
      <select class="tools-sheet__select" id="branch-filter"><option value="all">كل الفروع</option></select>
    </div>
    <div class="tools-sheet__group">
      <span data-i18n="tree.tools.tree">الشجرة</span>
      <div class="tools-sheet__btns">
        <button class="btn btn--outline btn--sm" id="expand-all-btn" data-i18n="tree.expandAll">فتح كل الفروع</button>
        <button class="btn btn--outline btn--sm" id="collapse-all-btn" data-i18n="tree.collapseAll">طيّ الكل</button>
      </div>
    </div>
    <div class="tools-sheet__group">
      <span data-i18n="tree.tools.tools">أدوات</span>
      <div class="tools-sheet__btns">
        <button class="btn btn--outline btn--sm" id="compare-toggle" data-i18n="tree.compare">حاسبة صلة القرابة</button>
        <a class="btn btn--outline btn--sm" href="tree-print.html" target="_blank" rel="noopener" data-i18n="tree.print">طباعة الشجرة كاملة</a>
      </div>
    </div>
    <div class="tools-sheet__group">
      <span data-i18n="tree.tools.lang">اللغة</span>
      <div class="lang-switch" role="group" aria-label="اختيار اللغة">
        <button class="lang-switch__btn" data-lang="ar">AR</button>
        <button class="lang-switch__btn" data-lang="en">EN</button>
      </div>
    </div>
    <p class="tools-sheet__meta" id="tree-stat"></p>
  </div>
</div>

<script src="assets/js/avatar.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/qrcode.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/tree.js"></script>
</body>
</html>
